# Raspberry Pi 5 profile (plan section 10, "Pi 5 value"). Test it on the PC CPU every week before porting.
profile: pi5

paths:
  models_dir: models
  cache_dir: cache
  rubric_dir: data/rubric        # approved rubric (T0.3); falls back to samples/rubric
  sessions_dir: data/sessions    # saved reports (gitignored)

audio:
  sample_rate: 16000
  input_device: null             # null = system default mic
  vad_threshold: 0.5
  min_speech_ms: 250
  segment_silence_ms: 600        # silence that closes a speech segment
  max_segment_s: 15              # force-split long segments for streaming ASR
  long_pause_s: 3.0              # pause counted as "long" in the report
  end_of_answer_silence_s: 5.0   # after the student has spoken: this much silence = answer done
  take_your_time_s: 5.0          # student has not started yet: face shows "Take your time"
  no_answer_timeout_s: 15.0      # student never started: move on to the next question
  echo_guard_ms: 400             # ignore the mic this long after the robot stops talking (speaker tail / room echo)

asr:
  backend: faster_whisper        # faster_whisper | whispercpp
  model: base                      # multilingual only (no .en models)
  compute_type: int8
  beam_size: 1
  cpu_threads: 2                # 0 = auto
  device: cpu
  language: null                 # null = auto-detect EN / Filipino
  languages: [en, tl]            # auto-detect chooses only between these (tl = Tagalog / Filipino)
  initial_prompt: "Umm, let me think, uh... So, ano, I think, um, yeah."   # keeps fillers in the transcript

tts:
  mode: cache                       # live | cache
  english_voice: en_US-lessac-medium
  filipino_backend: mms_tgl      # pre-synthesized only

vision:
  camera_index: 0
  width: 640
  height: 480
  fps: 12
  hfov_deg: 60                   # camera horizontal field of view, for turn angle
  gaze_yaw_max_deg: 15           # looking at robot if |yaw| and |pitch| under these
  gaze_pitch_max_deg: 15
  iris_offset_max: 0.30          # 0 = iris centered, 1 = at eye corner

scoring:
  backend: onnx_int8                 # sentence_transformers | onnx_int8
  embedder: multilingual-e5-small
  when: background                    # immediate | background | end_of_session
  level_temperature: 0.02        # softmax sharpness over anchor levels (calibrated on samples; re-tune in T2.2)
  key_point_threshold: 0.85      # cosine to count a key point as covered (recorded as a T3.1 feature)
  key_points_in_feedback: false  # descriptive key points do not separate good/poor answers with embeddings (v0 finding)


delivery:
  wpm_slow: 100                  # below this: "speak a little faster" (tune in T2.4)
  wpm_fast: 170                  # above this: "slow down"
  fillers_per_min_max: 4         # above this: filler-word tip
  latency_slow_s: 5              # long silence before starting the answer

voice:
  enabled: true                  # spoken commands for every on-screen choice (no touch screen needed)
  start_language: en             # the robot starts in English
  auto_language: true            # the student's FIRST spoken reply picks the language once ("simulan"/"oo" = Filipino); locked for the whole interview
  command_silence_ms: 500        # pause that ends a spoken command
  command_max_s: 6
  command_model: base            # small fast Whisper for spoken commands (~0.8 s on the PC vs ~7.5 s with the answer model)
  command_compute_type: int8
  retries: 2                     # times the robot says "I didn't catch that" before it just keeps waiting
  choice_timeout_s: 60           # silence on a choice screen: the robot asks again (choice_reprompts), then gives up
  choice_reprompts: 1            # consent still counts as No if nobody ever answers
  no_speech_prob_max: 0.6        # reject noise that Whisper turned into words
  avg_logprob_min: -1.2

face:
  fps: 24
  effects: false
  host: 127.0.0.1
  websocket_port: 8765

session:
  questions_per_session: 5
  programs: [CpE, ECE]           # courses in scope; the robot never asks which one: every session mixes both
  vary_questions: true           # rotate which CpE / ECE technical questions are asked from session to session
  answer_time_limit_s: 120
  start_on_face: false           # false = wait for "start" / tap; a face only makes the eyes follow
  follow_ups: true               # one approved follow-up when the answer is short or a criterion is weak
  follow_up_min_words: 15        # fewer words than this = "Could you tell me a bit more?"
  follow_up_below: 3.0           # weakest criterion at or below this score = its approved follow-up
  follow_up_wait_s: 8            # max wait for the preliminary score; if it is late, no follow-up is asked

reply:   # replies to what the student said; in scripted mode the local AI only rephrases approved lines
  topic_replies: true            # mention the student's topic (from the approved glossary) in replies
  llm: true                      # local AI rephrases the chosen approved line (English sessions only)
  llm_model: qwen2.5-0.5b-instruct-q4
  llm_threads: 3
  llm_ctx: 3072                  # prompt + memory + examples
  llm_timeout_s: 6              # if the AI is slower than this, the approved line is used as-is
  llm_max_words: 25
  laughter: true                 # mirror the student's laughter once per session (never laughs first)
  laughter_threshold: 0.30       # YAMNet "Laughter" probability needed (calibrate with real recordings)

interviewer:   # generative interviewer (coach/session/generative.py); English sessions only
  mode: generative               # generative = the local AI writes questions and replies | scripted = approved lines only
  ask_name: true                 # ask and confirm the student's first name, then use it naturally
  name_timeout_s: 12
  name_every: 2                  # use the name at most every 2 robot turns (more sounds robotic)
  callbacks: true                # connect a question to something the student said earlier
  memory_llm: true               # the AI writes short facts from each answer (kept only if grounded)
  knowledge: true                # look up the CpE/ECE knowledge library (samples/knowledge) for technical questions
  kb_min_sim: 0.80
  on_slot_min_sim: 0.8            # a written question this far from the rubric question is rejected (drift)
  praise: true                   # specific praise, only for a criterion the scorer rated high
  praise_min: 4.0
  max_words: 40
  question_timeout_s: 12          # if the next question is not written in time, the rubric question is asked
  follow_up_timeout_s: 9
  coach_summary: true            # AI-written coaching paragraph in the report (checked; template fallback)
  coach_timeout_s: 20
